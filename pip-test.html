<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>스톱워치 PIP 테스트</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px 18px;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;background:#f3f4f6;color:#111827;display:flex;justify-content:center}main{width:100%;max-width:420px}h1{font-size:23px;margin:8px 0}.desc{color:#6b7280;line-height:1.55;font-size:14px;margin:0 0 22px}.panel{background:#111827;color:white;border-radius:22px;padding:28px 18px;text-align:center;box-shadow:0 12px 30px #11182720}.eyebrow{font-size:12px;letter-spacing:2px;color:#9ca3af;font-weight:700}#display{font-size:clamp(54px,16vw,76px);font-variant-numeric:tabular-nums;font-weight:700;margin:16px 0 24px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:13px;padding:15px 10px;font-size:16px;font-weight:700;cursor:pointer;color:white;background:#374151;-webkit-tap-highlight-color:transparent}button:active{opacity:.78}#start{background:#16a34a}#pip{background:#2563eb;grid-column:1/-1}#reset{background:#4b5563}.status{background:white;border-radius:14px;padding:15px;margin-top:16px;font-size:13px;line-height:1.6;color:#374151}#status{font-weight:600}.tip{font-size:13px;color:#6b7280;line-height:1.6;margin:18px 2px}video{width:1px;height:1px;position:fixed;left:-10px;bottom:0;opacity:.01}
</style>
</head>
<body>
<main>
<h1>스톱워치 PIP 테스트</h1>
<p class="desc">아이폰 사파리에서 작은 화면(PIP)으로 스톱워치를 띄울 수 있는지 확인하는 실험용 버전입니다.</p>
<section class="panel">
<div class="eyebrow">STOPWATCH</div><div id="display">00:00</div>
<div class="buttons"><button id="start">시작</button><button id="reset">초기화</button><button id="pip">작은 화면(PIP) 띄우기</button></div>
</section>
<section class="status"><div>상태: <span id="status">준비됨</span></div><div id="detail">먼저 시작 버튼을 누른 다음 PIP 버튼을 눌러보세요.</div></section>
<p class="tip">테스트 순서: ① 시작 → ② 작은 화면(PIP) 띄우기 → ③ 홈 화면으로 나가거나 다른 앱으로 이동해 보세요.<br>PIP 화면이 나타나지 않으면 이 실험 방식이 현재 iPhone/iOS 환경에서 지원되지 않는 것일 수 있습니다.</p>
<video id="pipVideo" muted playsinline autoplay></video><canvas id="pipCanvas" width="640" height="360" hidden></canvas>
</main>
<script>
(() => {
const display=document.getElementById('display'),startButton=document.getElementById('start'),resetButton=document.getElementById('reset'),pipButton=document.getElementById('pip'),status=document.getElementById('status'),detail=document.getElementById('detail'),video=document.getElementById('pipVideo'),canvas=document.getElementById('pipCanvas'),ctx=canvas.getContext('2d');
let elapsedBeforeStart=0,startedAt=null,running=false,stream=null;
function elapsed(){return elapsedBeforeStart+(running?Date.now()-startedAt:0)}
function format(ms){const total=Math.floor(ms/1000),minutes=Math.floor(total/60),seconds=total%60;return String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0')}
function paint(){const value=format(elapsed());display.textContent=value;ctx.fillStyle='#111827';ctx.fillRect(0,0,640,360);ctx.textAlign='center';ctx.fillStyle='#9ca3af';ctx.font='bold 27px sans-serif';ctx.fillText('STOPWATCH',320,105);ctx.fillStyle='#fff';ctx.font='bold 112px sans-serif';ctx.fillText(value,320,235);ctx.fillStyle='#9ca3af';ctx.font='24px sans-serif';ctx.fillText(running?'RUNNING':'PAUSED',320,295)}
function updateButtons(){startButton.textContent=running?'정지':(elapsedBeforeStart>0?'다시 시작':'시작')}
startButton.addEventListener('click',()=>{if(running){elapsedBeforeStart+=Date.now()-startedAt;startedAt=null;running=false}else{startedAt=Date.now();running=true}updateButtons();paint()});
resetButton.addEventListener('click',()=>{elapsedBeforeStart=0;startedAt=running?Date.now():null;paint();updateButtons()});
async function prepareVideo(){if(!canvas.captureStream)throw new Error('이 Safari에서는 canvas 영상 스트림 기능을 사용할 수 없습니다.');if(!stream){stream=canvas.captureStream(15);video.srcObject=stream}video.muted=true;video.playsInline=true;await video.play()}
pipButton.addEventListener('click',async()=>{try{paint();status.textContent='PIP 실행 시도 중';detail.textContent='아이폰의 동영상 PIP 기능을 호출하고 있습니다.';await prepareVideo();if(typeof video.webkitSetPresentationMode==='function'){video.webkitSetPresentationMode('picture-in-picture');status.textContent='Safari PIP 요청 완료';detail.textContent='화면이 작게 분리되는지 확인해 보세요. 지원 여부는 iOS 버전에 따라 다를 수 있습니다.';return}if(document.pictureInPictureEnabled&&typeof video.requestPictureInPicture==='function'){await video.requestPictureInPicture();status.textContent='PIP 실행 중';detail.textContent='홈 화면으로 나가거나 다른 앱으로 이동해 보세요.';return}throw new Error('현재 Safari에서 웹페이지가 영상 PIP를 직접 실행하는 기능을 제공하지 않습니다.')}catch(error){status.textContent='PIP 실행 실패';detail.textContent=error&&error.message?error.message:'PIP를 실행하지 못했습니다.'}});
video.addEventListener('enterpictureinpicture',()=>{status.textContent='PIP 실행 중';detail.textContent='작은 화면이 표시되고 있습니다. 원래 페이지로 돌아오면 계속 조작할 수 있습니다.'});
video.addEventListener('leavepictureinpicture',()=>{status.textContent='PIP 종료됨';detail.textContent='스톱워치는 원래 페이지에서 계속 사용할 수 있습니다.'});
paint();updateButtons();window.setInterval(paint,200);
})();
</script>
</body>
</html>
