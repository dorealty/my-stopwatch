<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f9fc">
  <title>스톱워치</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: #f7f9fc;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                   "Noto Sans KR", sans-serif; color: #111827;
    }
    main { width: min(100%, 680px); text-align: center; }
    h1 { margin: 0 0 24px; font-size: 22px; font-weight: 700; color: #374151; }
    .display {
      padding: clamp(28px, 8vw, 56px) 12px;
      border: 2px solid #2563eb; border-radius: 28px;
      background: #eaf2ff; box-shadow: 0 8px 24px #1d4ed81a;
    }
    #time {
      font-variant-numeric: tabular-nums;
      font-size: clamp(64px, 18vw, 112px);
      line-height: 1.05; font-weight: 750; letter-spacing: -0.055em;
    }
    #detail { margin-top: 12px; color: #64748b; font-size: 18px; }
    .buttons {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; margin-top: 24px;
    }
    button {
      min-height: 76px; border: 0; border-radius: 18px; color: white;
      font: inherit; font-size: clamp(17px, 4vw, 21px); font-weight: 700;
      cursor: pointer; touch-action: manipulation;
      box-shadow: 0 5px 12px #00000018;
      -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: translateY(1px); filter: brightness(.94); }
    button:focus-visible { outline: 3px solid #111827; outline-offset: 3px; }
    #start { background: #16a34a; }
    #stop { background: #dc2626; }
    #reset { background: #2563eb; }
    .hint { margin-top: 22px; color: #94a3b8; font-size: 13px; }
    @media (max-width: 390px) {
      body { padding: 16px; }
      .buttons { gap: 8px; }
      button { min-height: 68px; border-radius: 14px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>스톱워치</h1>
    <section class="display" aria-live="off" aria-label="경과 시간">
      <div id="time">00:00</div>
      <div id="detail">(0분 0초)</div>
    </section>
    <div class="buttons">
      <button id="start" type="button">▶ 시작</button>
      <button id="stop" type="button">■ 정지</button>
      <button id="reset" type="button">↻ 초기화</button>
    </div>
    <p class="hint">시작을 누르면 시간이 흐르고, 정지를 누르면 멈춥니다.</p>
  </main>
  <script>
    (() => {
      const timeEl = document.getElementById('time');
      const detailEl = document.getElementById('detail');
      let elapsedMs = 0;
      let startedAt = null;
      let intervalId = null;

      function render() {
        const totalSeconds = Math.floor(elapsedMs / 1000);
        const minutes = Math.floor(totalSeconds / 60);
        const seconds = totalSeconds % 60;
        timeEl.textContent =
          String(minutes).padStart(2, '0') + ':' +
          String(seconds).padStart(2, '0');
        detailEl.textContent = `(${minutes}분 ${seconds}초)`;
      }

      function update() {
        if (startedAt !== null) {
          elapsedMs += Date.now() - startedAt;
          startedAt = Date.now();
          render();
        }
      }

      function start() {
        if (intervalId !== null) return;
        startedAt = Date.now();
        intervalId = window.setInterval(update, 100);
      }

      function stop() {
        if (intervalId === null) return;
        elapsedMs += Date.now() - startedAt;
        startedAt = null;
        window.clearInterval(intervalId);
        intervalId = null;
        render();
      }

      function reset() {
        if (intervalId !== null) window.clearInterval(intervalId);
        intervalId = null;
        startedAt = null;
        elapsedMs = 0;
        render();
      }

      document.getElementById('start').addEventListener('click', start);
      document.getElementById('stop').addEventListener('click', stop);
      document.getElementById('reset').addEventListener('click', reset);
      render();
    })();
  </script>
</body>
</html>
